name = "my_gleam_webserver"
version = "1.0.0"
target = "erlang"
gleam = ">= 1.7.0"

description = "A Gleam/Cowboy HTTP server with OTP-aware graceful shutdown"
licences = ["Apache-2.0"]
repository = { type = "github", user = "ORESoftware", repo = "server.gleam" }

[dependencies]
gleam_stdlib = ">= 0.45.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_cowboy = ">= 1.1.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
